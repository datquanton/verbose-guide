name: MAS daily market report

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Session date (YYYY-MM-DD), blank = today"
        required: false
  schedule:
    # 15:15 ICT (UTC+7) = 08:15 UTC, Mon-Fri. Adjust if you only want Wednesdays.
    - cron: "15 8 * * 1-5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate report
        env:
          NARRATIVE_BACKEND: ${{ vars.NARRATIVE_BACKEND }}   # 'template' or 'anthropic'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VNSTOCK_SOURCE: VCI
        run: |
          DATE="${{ github.event.inputs.date }}"
          python -m mas_report.cli --live ${DATE:+--date $DATE} \
            --out "out/report_$(date +%F).docx"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: out/*.docx
